name: Build Windows executable

# Builds the StillScript.exe binary on a real Windows runner (PyInstaller
# cannot cross-compile) and attaches it to the matching GitHub release.
#
# NOTE: EXE_NAME below is the *output artifact* name shown on the release
# page, independent of the stillscript.py source filename. Keep it in step
# with stillscript.iss's MyAppExeName so the download always matches the
# release it's attached to. Renamed from DanScribe_v3 in masterplan 4.1.
#
# Runs automatically when a version tag (vX.Y.Z) is pushed, or manually via
# the Actions tab / `gh workflow run` for an existing tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .exe to (e.g. v3.0.0)"
        required: true

permissions:
  contents: write

env:
  EXE_NAME: StillScript

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        # Install torch from the CPU-only index BEFORE requirements.txt, so
        # openai-whisper's torch dependency is already satisfied and pip does
        # not pull the multi-GB default (CUDA) wheel into the exe. Pinned to
        # the exact version confirmed working by the first green v3.1.0 CI
        # run (2026-07-26) for reproducibility.
        run: pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Verify torch is the CPU build
        # Hard-fail the build if a CUDA wheel ever slips in.
        run: python -c "import torch,sys; assert '+cu' not in torch.__version__, torch.__version__; print('CPU torch OK:', torch.__version__)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch static ffmpeg (bundled into the exe)
        # Download a static Windows ffmpeg build and stage ffmpeg.exe +
        # ffprobe.exe at the workspace root for --add-binary below. Pinned to
        # a specific release for reproducibility (gyan.dev — same provider the
        # old Inno installer used via winget).
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $bin = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName -Destination ffmpeg.exe
          Copy-Item (Join-Path $bin.Directory.FullName "ffprobe.exe") -Destination ffprobe.exe
          ./ffmpeg.exe -version | Select-Object -First 1

      - name: Build executable
        # --collect-all whisper: bundles the model assets (mel_filters.npz,
        #   tokenizers) the app loads at transcribe time.
        # --collect-all librosa/numba/llvmlite: the diarization JIT stack.
        # --collect-all _soundfile_data (NOT "soundfile"): soundfile is a
        #   single module, so --collect-all soundfile does NOT grab the native
        #   libsndfile — it lives in the _soundfile_data package. Verified via
        #   a Linux onedir dry-run of these exact flags.
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "$EXE_NAME" \
            --icon "stillscript.ico" \
            --add-data "logo.jpg;." \
            --add-binary "ffmpeg.exe;." \
            --add-binary "ffprobe.exe;." \
            --collect-all whisper \
            --collect-all librosa \
            --collect-all _soundfile_data \
            --collect-all numba \
            --collect-all llvmlite \
            --collect-submodules sklearn \
            stillscript.py

      - name: Ensure a GitHub Release exists for this tag
        # `gh release upload` requires a Release object, not just a tag — a
        # pushed tag alone (the normal trigger for this workflow) does not
        # create one, which is why the first v3.1.0 run built the exe fine
        # but failed at upload with "release not found". Create a draft
        # release if one doesn't exist yet; leave it alone if it does (so
        # re-running this workflow for an already-published tag is a no-op
        # here). Draft, not public — these are in-house/friends-and-family
        # beta builds, not public announcements.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Automated build for $TAG."
          fi

      - name: Upload .exe to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.value }}" "dist/${EXE_NAME}.exe" --clobber
