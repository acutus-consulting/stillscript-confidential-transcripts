name: Build Windows executable

# Builds the DanScribe_v3.exe binary on a real Windows runner (PyInstaller
# cannot cross-compile) and attaches it to the matching GitHub release.
#
# NOTE: EXE_NAME below is the *output artifact* name shown on the release
# page, independent of the DanScribe_v2.py source filename. Bump it on the
# next major version release (in this file AND in DanScribe_v2.iss's
# MyAppExeName) so the download always matches the release it's attached to.
#
# Runs automatically when a version tag (vX.Y.Z) is pushed, or manually via
# the Actions tab / `gh workflow run` for an existing tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .exe to (e.g. v3.0.0)"
        required: true

permissions:
  contents: write

env:
  EXE_NAME: DanScribe_v3

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: >
          pyinstaller --onefile --windowed --name "$EXE_NAME"
          --add-data "logo.jpg;."
          --icon "danscribe.ico"
          DanScribe_v2.py

      - name: Upload .exe to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.value }}" "dist/${EXE_NAME}.exe" --clobber
